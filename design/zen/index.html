<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#a4b9ca"><title>禅意空间 · 微光</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="refinement.css"></head>
<body><button id="global-music" class="icon" hidden aria-label="开启音乐" aria-pressed="false" title="开启音乐"></button>
<main id="space" data-scene="light" aria-label="禅意空间">
  <div class="background" aria-hidden="true"></div><canvas id="water" aria-hidden="true"></canvas><div class="wash" aria-hidden="true"></div>
  <div class="atmosphere" aria-hidden="true"><div class="veil veil-one"></div><div class="veil veil-two"></div><div class="halo"></div></div>
  <canvas id="field" aria-hidden="true"></canvas><div id="ripples" aria-hidden="true"></div>
  <header><button class="glass icon back" aria-label="返回首页" title="返回首页" data-icon="back"></button><div class="wordmark"><span class="brand">宽 心 纪</span><h1>禅意空间</h1></div><button class="glass icon scenes-button" aria-label="切换环境" title="切换环境" data-icon="scenes" aria-expanded="false"></button></header>
  <dialog id="control-sheet" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title">环境</h2><button id="close-sheet" aria-label="关闭设置">×</button></div><section id="scene-panel" class="scene-panel" aria-label="环境选择" hidden><div class="scene-options"><button data-scene="light" aria-pressed="true"><span class="swatch light"></span>微光</button><button data-scene="mist" aria-pressed="false"><span class="swatch mist"></span>云境</button><button data-scene="stars" aria-pressed="false"><span class="swatch stars"></span>星寂</button></div></section><section id="music-panel" hidden><button id="choose-audio">添加自己的音乐</button><p id="audio-status">个人音乐保存在此设备，不会上传或跨设备同步</p><div id="music-list" aria-label="音乐列表"></div><input id="audio-files" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple hidden></section><section id="duration-panel" hidden><p class="sheet-copy">开始前选择总时长；静坐中可增加时间</p><button id="add-time">增加 10 分钟</button><div class="duration" role="group" aria-label="调整静坐时长"><button data-minutes="10" aria-pressed="false">10 分钟</button><button data-minutes="20" aria-pressed="true">20 分钟</button><button data-minutes="30" aria-pressed="false">30 分钟</button><button data-minutes="0" aria-pressed="false">不限时</button></div></section></dialog>
  <div class="intro"><span class="eyebrow">此刻，无需去往别处</span><h2>在微光里，<br>安静一会儿。</h2><span class="intro-line"></span></div>
  <div class="session-caption" hidden><div class="lotus" aria-hidden="true"><svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M32 40C16 29 23 13 32 4c9 9 16 25 0 36Z"/><path d="M32 40C13 40 6 27 7 14c14 1 25 9 25 26Zm0 0c19 0 26-13 25-26-14 1-25 9-25 26Z"/><path d="M32 40C19 47 8 43 2 36c10-7 20-6 30 4Zm0 0c13 7 24 3 30-4-10-7-20-6-30 4Z"/></svg></div><span class="session-label">静坐中</span><button id="timer" aria-label="隐藏静坐计时">00:00</button><span class="quiet-line">放松身心 · 安住当下</span></div>
  <section class="entry" aria-label="静坐设置"><div class="duration" role="group" aria-label="静坐时长"><button data-minutes="10" aria-pressed="false">10 分钟</button><button data-minutes="20" aria-pressed="true">20 分钟</button><button data-minutes="30" aria-pressed="false">30 分钟</button><button data-minutes="0" aria-pressed="false">不限时</button></div><button id="start" class="glass start"><span data-icon="spark"></span><span>开启静坐</span><span data-icon="arrow"></span></button><p id="session-result" role="status"></p><p class="touch-hint">轻触，感受空间的回应</p></section>
  <section class="player" aria-label="音乐播放控制" hidden><div class="transport"><button id="previous" class="glass icon skip" data-icon="previous" aria-label="上一首" title="上一首"></button><button id="play" class="glass icon main-play" data-icon="play" aria-label="播放" title="播放"></button><button id="next" class="glass icon skip" data-icon="next" aria-label="下一首" title="下一首"></button></div><div id="spectrum" aria-hidden="true"></div><button id="end" class="end">结束静坐</button></section>
  <nav class="practice-tools" aria-label="静坐设置"><button id="open-duration"><span data-icon="clock"></span>时长</button><button id="open-music"><span data-icon="music"></span>音乐</button><button id="open-scene"><span data-icon="environment"></span>环境</button></nav>
  <audio id="audio" preload="none"></audio><div id="notice" role="status" aria-live="polite"></div><footer>轻触空间，泛起涟漪</footer>
</main>
<section id="home-panel" aria-label="宽心纪首页" hidden>
  <iframe id="home-frame" title="宽心纪首页" data-src="/home.html" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
</section>
<script src="music-store.js"></script><script src="music-library.js"></script><script src="water.js"></script><script src="app.js"></script>
</body></html>
