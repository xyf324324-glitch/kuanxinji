<style>
#waterdrop-demo{color:#fff;font-family:"PingFang SC","Microsoft YaHei","SimSun",sans-serif;max-width:390px;margin:auto;--wall-cloud:none;--wall-sea:none}
#waterdrop-demo *{box-sizing:border-box}#waterdrop-demo [hidden]{display:none!important}
#waterdrop-demo .theme-preview{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
#waterdrop-demo .theme-preview button{border:1px solid light-dark(#d9d9d1,#525b57);background:light-dark(#f8f9f5,#26332c);color:light-dark(#4a554e,#ebeee8);border-radius:18px;padding:7px 13px;font:12px sans-serif}
#waterdrop-demo .theme-preview button[aria-pressed=true]{background:light-dark(#e0e7df,#4d6253)}
#waterdrop-demo .phone{position:relative;border:5px solid #202323;border-radius:47px;background:#56616b;overflow:hidden;isolation:isolate;box-shadow:0 10px 35px #101b231c}
#waterdrop-demo .scene{position:absolute;inset:0;z-index:-3;background-position:center;background-size:cover;background-image:var(--wall-cloud)}
#waterdrop-demo[data-theme=sea] .scene{background-image:var(--wall-sea)}
#waterdrop-demo .veil{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#2331450c,#182b3c14 30%,#17273324 62%,#15273315);pointer-events:none}
#waterdrop-demo .status{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font:500 12px Arial,sans-serif;position:relative}
#waterdrop-demo .island{position:absolute;width:105px;height:27px;border-radius:20px;background:#080b0e;top:10px;left:50%;transform:translateX(-50%)}
#waterdrop-demo .status small{font:10px Arial,sans-serif;letter-spacing:2px}
#waterdrop-demo .page{padding:0 17px 10px}
#waterdrop-demo .top{display:flex;align-items:center;justify-content:space-between;padding:8px 3px 0}
#waterdrop-demo .brand{position:relative;display:block;width:90px;height:42px;overflow:hidden}
#waterdrop-demo .brand img{position:absolute;left:-8px;top:-30px;width:106px;height:106px;max-width:none;object-fit:contain;filter:drop-shadow(0 1px 5px #ffffff55)}
#waterdrop-demo button,#waterdrop-demo textarea{font-family:inherit;-webkit-tap-highlight-color:transparent}
#waterdrop-demo .glass{position:relative;border:1px solid #ffffff7a;background:linear-gradient(132deg,#ffffff24,#ffffff0c 35%,#ffffff16);box-shadow:inset 1px 1px 1px #ffffff85,inset -1px -1px 2px #ffffff40,0 9px 22px #07141c1c;backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);color:#fff}
#waterdrop-demo .menu-button{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;padding:0}
#waterdrop-demo i{font-style:normal}#waterdrop-demo svg{width:20px;height:20px;stroke-width:1.35}#waterdrop-demo .menu-button i{font:23px Arial,sans-serif}
#waterdrop-demo .hero{display:flex;align-items:center;justify-content:center;padding:14px 6px 14px}
#waterdrop-demo h2{font:400 35px/1.35 "Noto Serif SC","SimSun",serif;letter-spacing:.13em;margin:0;text-shadow:0 1px 12px #24313c22}
#waterdrop-demo h2.title-glass{min-width:186px;padding:10px 25px 11px;border-radius:21px;font-size:32px;text-align:center;text-indent:.13em;background:linear-gradient(135deg,#ffffff26,#ffffff0d 65%),#172b3c50;backdrop-filter:blur(12px) saturate(1.25);-webkit-backdrop-filter:blur(12px) saturate(1.25);border-color:#ffffff88;box-shadow:inset 0 1px 1px #ffffff80,inset 0 -1px 1px #ffffff24,0 5px 18px #14283820;text-shadow:0 1px 3px #14283855}
#waterdrop-demo .calendar-control{display:flex;justify-content:flex-end;height:24px;margin-top:-4px}
#waterdrop-demo .month-toggle{display:grid;place-items:center;border:0;background:transparent;color:#fffffff0;width:30px;min-height:28px;padding:2px}
#waterdrop-demo .month-toggle i{display:flex;font-size:18px}
#waterdrop-demo .month-toggle svg{width:18px;height:18px}
#waterdrop-demo .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;padding:0 0 18px}
#waterdrop-demo .day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:56px;border:1px solid transparent;background:transparent;border-radius:50%;color:white;padding:5px 0;touch-action:pan-y}
#waterdrop-demo .day small{font-size:10px;opacity:.94}#waterdrop-demo .day span{font:17px Georgia,serif}
#waterdrop-demo .day.selected{border-color:#ffffff80;background:radial-gradient(ellipse at 20% 15%,#ffffff50,transparent 45%),linear-gradient(140deg,#ffffff1c,#ffffff08 60%,#ffdfa52a);box-shadow:inset 1px 1px 2px #ffffffad,inset -1px -2px 3px #ffe2b780,0 5px 12px #1727331c;backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6)}
#waterdrop-demo .journal{border-radius:29px;padding:24px 20px 13px;background-color:#12293633;backdrop-filter:blur(9px) saturate(1.3);-webkit-backdrop-filter:blur(9px) saturate(1.3)}
#waterdrop-demo .field+.field{border-top:1px solid #ffffff48;padding-top:19px}
#waterdrop-demo label{display:flex;align-items:center;gap:10px;font-size:17px;font-family:"Noto Serif SC","SimSun",serif;letter-spacing:.05em}
#waterdrop-demo label i{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;font:22px Georgia,serif}
#waterdrop-demo textarea{display:block;width:100%;min-height:116px;margin:13px 0 0;padding:0 0 16px;background:transparent;border:0;color:white;font-size:15px;line-height:1.9;resize:vertical;text-shadow:0 1px 3px #152b3444;border-radius:4px}
#waterdrop-demo textarea::placeholder{color:#ffffffb3}#waterdrop-demo textarea:focus-visible{outline:1px solid #ffffff88;outline-offset:5px}
#waterdrop-demo .footer{display:flex;flex-direction:column;align-items:center;padding:20px 0 0;gap:10px}
#waterdrop-demo .save{min-height:49px;width:77%;border-radius:40px;display:flex;justify-content:center;align-items:center;gap:12px;font-family:"SimSun",serif;font-size:18px;letter-spacing:.05em;touch-action:pan-y;background:radial-gradient(ellipse at 10% 0%,#ffffff55,transparent 42%),linear-gradient(130deg,#ffffff28,#ffffff08 65%,#ffe4bd30);box-shadow:inset 1px 1px 1px #ffffffb0,inset -2px -2px 4px #ffefcd90,0 8px 20px #14293828}
#waterdrop-demo .save i{display:flex;font-size:19px}
#waterdrop-demo .save-state{min-height:15px;font-size:10px;color:#ffffffe6;text-align:center;margin:0}
#waterdrop-demo .wisdom{font:11px "SimSun",serif;opacity:.86;letter-spacing:.07em;margin:0}
#waterdrop-demo .homebar{width:116px;height:4px;background:#fff;border-radius:4px;margin:16px auto 1px}
#waterdrop-demo .droplet{will-change:transform;isolation:isolate}
#waterdrop-demo .droplet:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--touch-x,50%) var(--touch-y,50%),#ffffff70,transparent 62%);opacity:0}
#waterdrop-demo .droplet.pressing:after{animation:ripple-water 700ms ease-out both}
@keyframes ripple-water{0%{opacity:.15;transform:scale(.4)}40%{opacity:.7}100%{opacity:.3;transform:scale(1.1)}}
#waterdrop-demo .month{border-radius:20px;padding:12px;margin-bottom:14px;background-color:#1d35495c}
#waterdrop-demo .month-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:9px}
#waterdrop-demo .month-head button{background:transparent;border:0;color:#fff;font-size:20px;min-width:32px;min-height:36px}
#waterdrop-demo .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
#waterdrop-demo .month-grid button{min-height:35px;min-width:0;border:0;background:transparent;color:#fff;border-radius:50%;font:14px Georgia,serif}
#waterdrop-demo .month-grid button.selected{background:#ffffff2b;box-shadow:inset 0 1px #ffffff99}
#waterdrop-demo .menu-shade{position:absolute;inset:0;background:#12243460;border:0;z-index:4;backdrop-filter:blur(5px)}
#waterdrop-demo nav{position:absolute;z-index:5;inset:0 0 0 17%;padding:62px 27px;background:#34434a99;backdrop-filter:blur(32px) saturate(1.5);-webkit-backdrop-filter:blur(32px) saturate(1.5);border-left:1px solid #ffffff55}
#waterdrop-demo nav h3{font:27px/1.7 "KaiTi","SimSun",serif;margin:10px 0 35px}
#waterdrop-demo nav small{font-size:11px;opacity:.7}#waterdrop-demo nav p{padding-top:16px}
#waterdrop-demo nav button{display:block;border:0;background:transparent;color:#fff;font:17px "SimSun",serif;padding:13px 0;width:100%;text-align:left}
#waterdrop-demo nav .close{position:absolute;top:15px;right:20px;width:35px;font:25px Arial,sans-serif;text-align:center}
@media(max-width:350px){#waterdrop-demo .page{padding-inline:12px}#waterdrop-demo .journal{padding-inline:16px}#waterdrop-demo textarea{font-size:14px}#waterdrop-demo .hero{padding-top:17px}}
@media(pointer:coarse){#waterdrop-demo textarea{font-size:16px}#waterdrop-demo .menu-button{min-height:44px;min-width:44px}#waterdrop-demo .month-grid button{min-height:44px}}
@media(prefers-reduced-motion:reduce){#waterdrop-demo .droplet:after{animation:none!important}#waterdrop-demo .droplet{will-change:auto}}
</style>
<div id="waterdrop-demo" data-theme="cloud" aria-label="功过格手机动效预览">
 <div class="theme-preview" aria-label="预览背景"><button type="button" data-theme-pick="auto" aria-pressed="true">每日随机</button><button type="button" data-theme-pick="cloud" aria-pressed="false">云光</button><button type="button" data-theme-pick="sea" aria-pressed="false">海光</button></div>
 <div class="phone"><div class="scene" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
 <div class="status" aria-hidden="true"><span>9:41</span><div class="island"></div><small>▂▅▇ ▰</small></div>
 <div class="page"><header class="top"><div class="brand"><img src="__BRAND__" alt="宽心纪"></div><button class="menu-button glass" type="button" data-action="menu" aria-label="打开导航"><i data-lucide="menu" aria-hidden="true">☰</i></button></header>
 <div class="hero"><h2>功过格</h2><p>观照今日，不必苛责自己</p></div><div class="calendar-control"><span class="current-month"></span><button class="today-control" type="button" data-action="today">回到今天</button><button class="month-toggle" type="button" data-action="month" aria-label="展开月历" aria-expanded="false" aria-controls="drop-month"><i data-lucide="calendar-days" aria-hidden="true">▦</i></button></div>
 <div class="week" aria-label="选择记录日期"></div>
 <section class="month glass" id="drop-month" aria-label="月历" hidden><div class="month-head"><button type="button" data-action="prev-month" aria-label="上个月">‹</button><span></span><button type="button" data-action="next-month" aria-label="下个月">›</button></div><div class="month-grid"></div></section>
 <form class="journal glass" aria-label="每日言行登记">
 <div class="field"><div class="field-heading"><label for="drop-good"><span class="zen-mark"><img src="./meditation.svg" alt="" aria-hidden="true"></span>今日之善</label><button type="button" class="expand-editor" data-editor="good" aria-haspopup="dialog">展开编辑</button></div><p id="good-guide">今天有哪些值得记住的善意与善行？</p><textarea id="drop-good" aria-describedby="good-guide" maxlength="400" rows="3" placeholder="在这里写下…"></textarea></div>
 <div class="field"><div class="field-heading"><label for="drop-loss"><span class="zen-mark"><img src="./meditation.svg" alt="" aria-hidden="true"></span>今日之省</label><button type="button" class="expand-editor" data-editor="loss" aria-haspopup="dialog">展开编辑</button></div><p id="loss-guide">今天哪一念、哪件事，值得重新看看？</p><textarea id="drop-loss" aria-describedby="loss-guide" maxlength="400" rows="3" placeholder="在这里写下…"></textarea></div>
 <div class="field"><div class="field-heading"><label for="drop-next"><span class="zen-mark"><img src="./meditation.svg" alt="" aria-hidden="true"></span>明日一行</label><button type="button" class="expand-editor" data-editor="next" aria-haspopup="dialog">展开编辑</button></div><p id="next-guide">给明天的自己，留一个可以做到的小行动。</p><textarea id="drop-next" aria-describedby="next-guide" maxlength="400" rows="3" placeholder="在这里写下…"></textarea></div>
 </form>
 <footer class="footer"><button class="save droplet" type="button" data-action="save"><i data-lucide="pen-line" aria-hidden="true">✎</i><span>保存今日</span></button><p class="save-state" role="status" aria-live="polite"></p><p class="wisdom">不必写满，记录一念也是开始。</p></footer>
 </div>
 <button class="menu-shade" type="button" data-action="close-menu" aria-label="关闭导航" hidden></button><nav aria-label="功过格页面导航" hidden><button class="close" type="button" data-action="close-menu" aria-label="关闭导航">×</button><small>宽心纪 · 日省</small><h3>照见今日，<br>慢慢践行。</h3><button type="button" data-action="focus-good">今日之善</button><button type="button" data-action="focus-loss">今日之省</button><button type="button" data-action="focus-next">明日一行</button><button type="button" data-action="history">查看历史记录</button></nav><dialog class="editor-dialog" aria-labelledby="editor-title" aria-describedby="editor-guide"><div class="editor-heading"><h3 id="editor-title"></h3><button class="editor-done" type="button">完成编辑</button></div><p class="editor-guide" id="editor-guide"></p><textarea id="expanded-text" maxlength="400" aria-labelledby="editor-title" aria-describedby="editor-guide" placeholder="在这里慢慢写下…"></textarea><div class="editor-meta"><p class="editor-status" role="status"></p><span class="editor-count"></span></div></dialog>
 </div>
</div>
