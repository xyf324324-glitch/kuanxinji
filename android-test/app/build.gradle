plugins { id 'com.android.application' }
android {
    namespace 'dev.kuanxinji.preview'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.kuanxinji.preview'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-test'
        buildConfigField 'String', 'SITE_URL', '"' + (project.findProperty('siteUrl') ?: 'https://codex-android-apk.kuanxinji.pages.dev/') + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/kuanxinji-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
